<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tsuki Cam 月カメ — Moonlit Photobooth</title>
    <meta name="description" content="Tsuki Cam (月カメ) is a free, cute photobooth in your browser. Snap or upload photos, add filters, frames and captions, and download your photo strip. Photos never leave your device." />
    <meta name="theme-color" content="#fdfdff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1129" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tsuki Cam" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://photo-bot-kappa.vercel.app/" />
    <meta property="og:image" content="https://photo-bot-kappa.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tsuki Cam 月カメ, a moonlit photobooth" />
    <meta property="og:title" content="Tsuki Cam 月カメ — Moonlit Photobooth" />
    <meta property="og:description" content="Snap a photo strip in your browser with filters, frames and captions." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://photo-bot-kappa.vercel.app/og-image.png" />
    <meta name="twitter:title" content="Tsuki Cam 月カメ — Moonlit Photobooth" />
    <meta name="twitter:description" content="Snap a photo strip in your browser with filters, frames and captions." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Tsuki Cam needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
