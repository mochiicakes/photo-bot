<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo-bot — Virtual Photobooth</title>
    <meta name="description" content="A free virtual photobooth in your browser. Snap or upload photos, add filters, frames and captions, and download your photo strip. Photos never leave your device." />
    <meta name="theme-color" content="#f6efe3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14100e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Photo-bot — Virtual Photobooth" />
    <meta property="og:description" content="Snap a photo strip in your browser with filters, frames and captions." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Photo-bot — Virtual Photobooth" />
    <meta name="twitter:description" content="Snap a photo strip in your browser with filters, frames and captions." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Photo-bot needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
